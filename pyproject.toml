[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "risk_reasoning"
version = "0.1.0"
description = "Do Artificial Stakes Improve LLM Risk Reasoning? (CS639 Foundation Models, Spring 2026)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Shrey Katyal" },
    { name = "Dev Sinha" },
    { name = "Aditya Dube" },
    { name = "Shreekar Earanti" },
    { name = "Atiksh Shah" },
    { name = "Sukrut Chikodikar" },
    { name = "Taran Savoor" },
]
keywords = ["llm", "risk-reasoning", "calibration", "foundation-models", "cs639"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "anthropic>=0.39.0",
    "transformers>=4.44.0,<5.0.0",
    "datasets>=2.20.0",
    "huggingface_hub>=0.24.0",
    "torch>=2.5.1,<2.6.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
    "scikit-learn>=1.5.0",
    "pydantic>=2.8.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.2",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "pyarrow>=16.0.0",
    "PyYAML>=6.0.3",
]

[project.optional-dependencies]
vllm = [
    "vllm>=0.6.6,<0.7.0",
]
ollama = [
    "ollama>=0.3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "jupyterlab>=4.2.0",
    "ipykernel>=6.29.0",
]

[project.scripts]
risk-run = "risk_reasoning.experiments.runner:main"

[project.urls]
Homepage = "https://github.com/cs639/artificial-stakes-llm-risk"

[tool.hatch.build.targets.wheel]
packages = ["src/risk_reasoning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]
"notebooks/*" = ["E402", "F401"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
