# Full experimental run reproducing the paper's core matrix:
#   {4 conditions} x {5 datasets} x {2 subject models}, judged by Claude Sonnet.
# Usage: python scripts/run_experiment.py --config configs/experiments/full_matrix.yaml
defaults:
  - /base
  - _self_

conditions:
  - bare_baseline
  - surface_stakes
  - persistent_stakes
  - cot_only

datasets:
  - synthetic_ev
  - convfinqa
  - arc_challenge
  - medqa
  - sequential_budget

models:
  - llama31_8b_base
  - llama31_8b_instruct

judge_model: claude_sonnet_judge

n_samples: 8
seeds: [42, 43, 44]

run_name: full_matrix
