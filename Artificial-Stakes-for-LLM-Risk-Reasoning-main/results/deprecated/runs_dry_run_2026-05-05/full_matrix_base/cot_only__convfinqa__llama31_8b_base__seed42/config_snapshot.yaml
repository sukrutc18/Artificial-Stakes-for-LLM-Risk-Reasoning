conditions:
- bare_baseline
- surface_stakes
- persistent_stakes
- cot_only
datasets:
- synthetic_ev
- convfinqa
- arc_challenge
- medqa
- sequential_budget
models:
- llama31_8b_base
judge_model: claude_sonnet_judge
n_samples: 4
seeds:
- 42
max_items: 1
logging:
  run_name: full_matrix_base
cell:
  condition: cot_only
  dataset: convfinqa
  model: llama31_8b_base
  seed: 42
  n_samples: 4
  extra:
    condition_cfg:
      name: cot_only
      framing: cot_only
      description: 'Explicit CoT scaffold ("think step by step, consider alternatives
        and risks") with no mention of budgets or stakes. Separates reasoning elicitation
        from the effect of stakes per se.

        '
      uses_budget: false
      uses_cot_scaffold: true
      feedback: outcome_only
    dataset_cfg:
      name: convfinqa
      loader: risk_reasoning.data.convfinqa:load
      task_type: numeric
      hf_path: ChanceFocus/flare-convfinqa
      split: valid
      max_items: 300
      preprocessing:
        flatten_turns: true
        include_tables_as_markdown: true
      metrics:
        primary: accuracy
        tolerance: 0.01
        also:
        - calibration
        - reasoning_proxies
    model_cfg:
      name: llama31_8b_base
      backend: vllm
      hf_id: meta-llama/Meta-Llama-3.1-8B
      role: subject
      serving:
        base_url: http://localhost:8000/v1
        api_key: EMPTY
        dtype: bfloat16
        max_model_len: 8192
        tensor_parallel_size: 1
      generation_defaults:
        temperature: 0.7
        top_p: 0.95
        max_new_tokens: 1024
      tokenizer:
        chat_template: null
