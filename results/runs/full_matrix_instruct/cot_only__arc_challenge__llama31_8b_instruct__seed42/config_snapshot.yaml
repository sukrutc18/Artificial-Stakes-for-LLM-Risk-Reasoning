conditions:
- bare_baseline
- surface_stakes
- persistent_stakes
- cot_only
datasets:
- synthetic_ev
- convfinqa
- arc_challenge
- medqa
- sequential_budget
models:
- llama31_8b_instruct
judge_model: claude_sonnet_judge
n_samples: 4
seeds:
- 42
max_items: 25
logging:
  run_name: full_matrix_instruct
cell:
  condition: cot_only
  dataset: arc_challenge
  model: llama31_8b_instruct
  seed: 42
  n_samples: 4
  extra:
    condition_cfg:
      name: cot_only
      framing: cot_only
      description: 'Explicit CoT scaffold ("think step by step, consider alternatives
        and risks") with no mention of budgets or stakes. Separates reasoning elicitation
        from the effect of stakes per se.

        '
      uses_budget: false
      uses_cot_scaffold: true
      feedback: outcome_only
    dataset_cfg:
      name: arc_challenge
      loader: risk_reasoning.data.arc:load
      task_type: mcq
      hf_path: allenai/ai2_arc
      hf_config: ARC-Challenge
      split: test
      max_items: 500
      metrics:
        primary: accuracy
        also:
        - calibration
        - reasoning_proxies
    model_cfg:
      name: llama31_8b_instruct
      backend: vllm
      hf_id: meta-llama/Meta-Llama-3.1-8B-Instruct
      role: subject
      serving:
        base_url: http://localhost:8000/v1
        api_key: EMPTY
        dtype: bfloat16
        max_model_len: 8192
        tensor_parallel_size: 1
      generation_defaults:
        temperature: 0.7
        top_p: 0.95
        max_new_tokens: 1024
      tokenizer:
        chat_template: llama-3.1
