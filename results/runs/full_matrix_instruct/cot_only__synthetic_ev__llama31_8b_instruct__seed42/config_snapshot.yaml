conditions:
- bare_baseline
- surface_stakes
- persistent_stakes
- cot_only
datasets:
- synthetic_ev
- convfinqa
- arc_challenge
- medqa
- sequential_budget
models:
- llama31_8b_instruct
judge_model: claude_sonnet_judge
n_samples: 4
seeds:
- 42
max_items: 25
logging:
  run_name: full_matrix_instruct
cell:
  condition: cot_only
  dataset: synthetic_ev
  model: llama31_8b_instruct
  seed: 42
  n_samples: 4
  extra:
    condition_cfg:
      name: cot_only
      framing: cot_only
      description: 'Explicit CoT scaffold ("think step by step, consider alternatives
        and risks") with no mention of budgets or stakes. Separates reasoning elicitation
        from the effect of stakes per se.

        '
      uses_budget: false
      uses_cot_scaffold: true
      feedback: outcome_only
    dataset_cfg:
      name: synthetic_ev
      loader: risk_reasoning.data.synthetic:load
      task_type: mcq
      num_items: 500
      seed: 42
      generator:
        families:
        - ev_two_option
        - ev_three_option
        - conditional_probability
        - base_rate
        - bayes_update
        difficulty: mixed
        distractor_strategy: confusable_ev
        include_confidence_prompt: true
      metrics:
        primary: accuracy
        also:
        - calibration
        - reasoning_proxies
    model_cfg:
      name: llama31_8b_instruct
      backend: vllm
      hf_id: meta-llama/Meta-Llama-3.1-8B-Instruct
      role: subject
      serving:
        base_url: http://localhost:8000/v1
        api_key: EMPTY
        dtype: bfloat16
        max_model_len: 8192
        tensor_parallel_size: 1
      generation_defaults:
        temperature: 0.7
        top_p: 0.95
        max_new_tokens: 1024
      tokenizer:
        chat_template: llama-3.1
